<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PiggyMe</title>
    <link rel="stylesheet" href="../css/metas.css">
    <script src="/js/metas.js"></script>
</head>

<body>

    <header>
        <img src="../images/piggyme_logo2.png" class="porco-logo" alt="Logo PiggyMe">
        <div class="menu-direita">
            <h2 id="saudacao">Olá!</h2>
            <div class="botao-inicio">
                <button onclick="window.location.href='/'"><strong>Início</strong></button>
            </div>
            <div class="icone_conta">
                <img src="../images/icone_conta.png" alt="Ícone da conta">
            </div>
        </div>
    </header>

    <main class="dashboard">

        <aside class="botoes-resto">
            <button>Dashboard</button>
            <button onclick="window.location.href='receita'">Receita</button>
            <button onclick="window.location.href='menu'">Menu</button>
            <button>Relatórios</button>
        </aside>

        <section class="conteudo">

            <div class="segunda-header">
                <div>
                    <h1>Metas</h1>
                    <h2>Defina seus objetivos e conquiste seus sonhos passo a passo</h2>
                    <aside class="botoes-header2">
                        <button onclick="window.location.href='add_gastos'">Criar nova Meta</button>
                    </aside>
                </div>
                <img class="pig-background" src="../images/pig_background_metas.png">
            </div>

            <div class="cards-area">

                <div class="card saldo-card">
                    <img class="icone-moeda" src="../images/icone_metas.png">
                    <div>
                        <h2>Resumo das metas</h2>
                        <h1 id="saldo-valor">R$ 0,00</h1>
                    </div>
                    
                </div>

                <div class="card xp-card">
                    <div class="xp-info">
                        <!-- gamification.js atualiza estes elementos automaticamente -->
                        <h2>Total de metas</h2>
                        <h1>1</h1>
                        
                    </div>
                </div>

                <div class="card objetivos-card">
                    <div class="objetivos-topo">
                        <h2>Metas ativas</h2>
                    </div>
                    <div class="objetivo">
                        <p>casa</p>
                         <div class="barra-xp">
                            <div class="xp-preenchido" style="width: 0%;"></div>
                        </div>
                        <span>70%</span>
                    </div>
                    <div class="objetivo">
                        <p>automovel</p>
                         <div class="barra-xp">
                            <div class="xp-preenchido" style="width: 0%;"></div>
                        </div>
                        <span>20%</span>
                    </div>
                    <div class="consquistas">
                        <span class="valor-dias">33</span>
                        <span>Dias em sequencia</span>
                    </div>
                </div>

                <div class="card conquistas_gerais">
                    <h2>Conquistas Recentes</h2>
                    
                    <span>Meta: Viagem para japão</span>
                    
                    <span>Meta: Viagem para Colombia</span>
                 
                    <span>Meta: Viagem para venezuela</span>
                </div>

                <div class="card resumo-card">
                    <h2>Progresso geral</h2>
                    <div class="barra-xp">
                            <div class="xp-preenchido" style="width: 0%;"></div>
                    </div>
                </div>

            </div>

        </section>

    </main>

    <script>

        const usuario = JSON.parse(localStorage.getItem('usuario') || '{}');
        if (usuario.nome) {
            document.getElementById('saudacao').textContent = `Olá, ${usuario.nome}!`;
        }
    </script>

</body>
</html>
