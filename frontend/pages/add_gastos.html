<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PiggyMe – Adicionar Gasto</title>
    <link rel="stylesheet" href="../css/menu.css">
    <link rel="stylesheet" href="../css/add_gastos.css">
    <link rel="stylesheet" href="../css/historico_edicao.css">
    <script src="../js/auth.js"></script>
    
</head>

<body>

    <header>
        <img src="../images/piggyme_logo2.png" class="porco-logo" alt="Logo PiggyMe">
        <div class="menu-direita">
            <div class="botao-inicio">
                <button onclick="window.location.href='menu'">
                    <strong>Início</strong>
                </button>
            </div>
        </div>
    </header>

    <main class="dashboard">

        <aside class="botoes-resto">
            <button onclick="window.location.href='menu'">
                <svg fill="currentColor" viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
                Dashboard
            </button>
            <button onclick="window.location.href='add_gastos'">
                <svg fill="currentColor" viewBox="0 0 24 24"><path d="M21 7H3a1 1 0 00-1 1v12a2 2 0 002 2h16a2 2 0 002-2V8a1 1 0 00-1-1zm-1 12H4V9h16v10zM3 5h15a1 1 0 000-2H3a1 1 0 000 2z"/></svg>
                Gastos
            </button>
            <button>
                <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>
                Metas
            </button>
            <button onclick="window.location.href='/historico'">
                <svg fill="currentColor" viewBox="0 0 24 24"><path d="M5 12H3v9h2v-9zm4-5H7v14h2V7zm4-4h-2v18h2V3zm4 8h-2v10h2v-10zm4-4h-2v14h2V7z"/></svg>
                Relatórios
            </button>
            <button>
                <svg fill="currentColor" viewBox="0 0 24 24"><path d="M19.07 10.49A7.01 7.01 0 0012.07 4h-.5C10.14 2.82 8.91 2 7.5 2 6.24 2 5 2.74 4.31 4H4a2 2 0 00-2 2v1a2 2 0 002 2h.07A7.02 7.02 0 004 11.07 7.01 7.01 0 009 17.93V20H8a1 1 0 000 2h8a1 1 0 000-2h-1v-2.07a7.01 7.01 0 005.07-5.44H21a1 1 0 000-2h-1.93z"/></svg>
                Seu porquinho
            </button>
            <button class="btn-sair" onclick="sair()">
                <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
                Sair
            </button>
        </aside>

        <section class="conteudo">

            <div class="hero-banner">
                <div class="hero-icone">
                    <svg fill="currentColor" viewBox="0 0 24 24"><path d="M21 7H3a1 1 0 00-1 1v12a2 2 0 002 2h16a2 2 0 002-2V8a1 1 0 00-1-1zm-1 12H4V9h16v10zM3 5h15a1 1 0 000-2H3a1 1 0 000 2z"/></svg>
                </div>
                <div class="hero-texto">
                    <h1>Adicionar gasto</h1>
                    <p>Registre suas despesas e acompanhe para onde seu dinheiro está indo.</p>
                </div>
                <img src="../images/22.png" class="hero-imagem-deco" alt="Ilustração financeira">
            </div>

            <div class="grid-form-resumo">

                <div class="card-form">
                    <div class="campos-grid">

                        <div class="campo-grupo">
                            <label for="descricao">Nome do gasto</label>
                            <input type="text" id="descricao" placeholder="Ex: Mercado, Aluguel…" maxlength="100">
                        </div>

                        <div class="campo-grupo">
                            <label for="valor">Valor (R$)</label>
                            <input type="number" id="valor" placeholder="R$ 0,00" min="0" step="0.01">
                        </div>

                        <div class="campo-grupo">
                            <label for="categoria">Categoria</label>
                            <select id="categoria">
                                <option value="">Selecione uma categoria</option>
                            </select>
                            <span class="erro-categoria" id="erroCategoria">Selecione uma categoria.</span>
                        </div>

                        <div class="campo-grupo">
                            <label for="data">Data</label>
                            <div class="input-data-wrap">
                                <input type="date" id="data">
                                <span class="icone-cal">
                                    <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                        <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
                                        <line x1="16" y1="2" x2="16" y2="6"/>
                                        <line x1="8" y1="2" x2="8" y2="6"/>
                                        <line x1="3" y1="10" x2="21" y2="10"/>
                                    </svg>
                                </span>
                            </div>
                        </div>

                    </div>

                    <div class="botoes-form">
                        <button class="btn-salvar" onclick="salvar()">Salvar gasto</button>
                        <a class="btn-cancelar" href="menu">Cancelar</a>
                    </div>
                </div>

                <div class="card-resumo">
                    <div class="resumo-titulo">
                        <svg viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M18 2a16 16 0 100 32A16 16 0 0018 2z" fill="#e8f5e2"/>
                            <path d="M18 2v16l11.31 11.31A16 16 0 0018 2z" fill="#73002f" opacity=".7"/>
                            <path d="M18 18L6.69 29.31A16 16 0 0018 34V18z" fill="#73002f" opacity=".4"/>
                        </svg>
                        <span>Resumo rápido</span>
                    </div>
                    <div class="resumo-linha">
                        <label>Saldo atual:</label>
                        <span class="valor" id="saldoAtual">R$ –</span>
                    </div>
                    <div class="resumo-linha">
                        <label>Após este gasto:</label>
                        <span class="valor" id="saldoApos">R$ –</span>
                    </div>
                </div>

            </div>

            <div class="card-historico">
                <div class="historico-cabecalho">
                    <svg fill="currentColor" viewBox="0 0 24 24" width="24" height="24">
                        <path d="M13 3a9 9 0 10.001 18.001A9 9 0 0013 3zm0 16a7 7 0 110-14 7 7 0 010 14zm.5-11H12v6l5.25 3.15.75-1.23-4.5-2.67V8z"/>
                    </svg>
                    
            </div>

        </section>

    </main>

    <div class="modal-overlay" id="modalCategoria">
        <div class="modal-box">
            <h3>Nova categoria</h3>
            <input type="text" id="novaCategoriaInput" placeholder="Ex: Mercado, Transporte…" maxlength="50">
            <div class="modal-botoes">
                <button onclick="fecharModalCategoria()">Cancelar</button>
                <button class="btn-confirmar" onclick="confirmarNovaCategoria()">Criar</button>
            </div>
        </div>
    </div>

    <script src="../js/gamification.js"></script>
    <script src="../js/add_gastos.js"></script>

</body>
</html>
