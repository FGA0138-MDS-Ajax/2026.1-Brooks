<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>PiggyMe – Informar Gasto</title>

    <link rel="stylesheet"
          href="../css/menu.css">

    <style>

        .form-gasto {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 40px;
            height: 100%;
            padding: 60px 0;
        }

        .form-gasto h2 {
            font-size: 38px;
            color: #73002f;
        }

        .campos {
            display: flex;
            flex-direction: column;
            gap: 30px;
            width: 100%;
            max-width: 600px;
        }

        .campo-grupo {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .campo-grupo label {
            font-size: 24px;
            font-weight: bold;
            color: #73002f;
        }

        .campo-grupo input,
        .campo-grupo select {
            height: 70px;
            border-radius: 40px;
            border: 4px solid #333;
            background-color: white;
            font-size: 24px;
            padding: 0 28px;
            color: #333;
            outline: none;
            font-family: Arial, Helvetica, sans-serif;
            transition: 0.2s;
            width: 100%;
            appearance: none;
            cursor: pointer;
        }

        .campo-grupo input:focus,
        .campo-grupo select:focus {
            border-color: #73002f;
            background-color: #f9fdf6;
        }

        .campo-grupo input::placeholder {
            color: #bbb;
        }

        .select-wrap {
            position: relative;
        }

        .select-wrap::after {
            content: '▾';
            position: absolute;
            right: 28px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 24px;
            color: #73002f;
            pointer-events: none;
        }

        .botoes-form {
            display: flex;
            gap: 24px;
            margin-top: 10px;
        }

        .btn-cancelar {
            width: 200px;
            height: 70px;
            border-radius: 40px;
            border: 4px solid #333;
            background-color: white;
            font-size: 22px;
            font-weight: bold;
            color: #333;
            cursor: pointer;
            transition: 0.3s;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-cancelar:hover {
            transform: scale(1.03);
            background-color: #f0f0f0;
        }

        .btn-salvar {
            width: 200px;
            height: 70px;
            border-radius: 40px;
            border: 4px solid #73002f;
            background-color: #73002f;
            font-size: 22px;
            font-weight: bold;
            color: white;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-salvar:hover {
            transform: scale(1.03);
            background-color: #5c0f27;
        }

    </style>

</head>

<body>
    <header>

        <img src="../images/piggyme_logo2.png"
             class="porco-logo"
             alt="Logo PiggyMe">

        <div class="menu-direita">

            <div class="botao-inicio">

                <button onclick="window.location.href='menu'">
                    <strong>Início</strong>
                </button>

            </div>
            <div class="icone_conta">

                <img src="../images/icone_conta.png"
                     alt="Ícone da conta">
            </div>
        </div>
    </header>
    <main class="dashboard">
        <aside class="botoes-resto">

            <button>Categoria</button>

            <button>Categoria</button>

            <button>Categoria</button>

            <button>Categoria</button>

            <button onclick="window.location.href='add_gastos'">Informar gasto -</button>

            <button onclick="window.location.href='add_receita'">Adicionar entrada +</button>

        </aside>

        <section class="conteudo">
            <div class="card">
                <div class="form-gasto">
                    <h2>Informar Gasto</h2>
                    <div class="campos">
                        <div class="campo-grupo">
                            <label for="descricao">Descrição</label>
                            <input type="text"
                                   id="descricao"
                                   placeholder="Ex: Mercado, Aluguel…"
                                   maxlength="100">
                        </div>

                        <div class="campo-grupo">
                            <label for="valor">Valor (R$)</label>
                            <input type="number"
                                   id="valor"
                                   placeholder="0,00"
                                   min="0"
                                   step="0.01">
                        </div>

                        <div class="campo-grupo">
                            <label for="categoria">Categoria</label>
                            <div class="select-wrap">
                                <select id="categoria">
                                    <option value="">Selecionar…</option>
                                    <option value="Alimentação">Alimentação</option>
                                    <option value="Moradia">Moradia</option>
                                    <option value="Transporte">Transporte</option>
                                    <option value="Saúde">Saúde</option>
                                    <option value="Educação">Educação</option>
                                    <option value="Lazer">Lazer</option>
                                    <option value="Outros">Outros</option>
                                </select>
                            </div>
                        </div>

                    </div>

                    <div class="botoes-form">

                        <a class="btn-cancelar"
                           href="menu">Cancelar</a>

                        <button class="btn-salvar"
                                onclick="salvar()">Salvar</button>

                    </div>

                </div>

            </div>

        </section>

    </main>

    <script src="../js/gamification.js"></script>
    <script>
        async function salvar() {
            const desc      = document.getElementById('descricao').value.trim();
            const valor     = parseFloat(document.getElementById('valor').value);
            const categoria = document.getElementById('categoria').value;

            if (!desc)                { alert('Informe uma descrição.'); return; }
            if (!valor || valor <= 0) { alert('Informe um valor válido.'); return; }
            if (!categoria)           { alert('Selecione uma categoria.'); return; }

            const btn = document.querySelector('.btn-salvar');
            btn.disabled = true;
            btn.textContent = 'Salvando…';

            try {
                const token = localStorage.getItem('token');
                const resp = await fetch('/api/transacoes/gasto', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ descricao: desc, valor, categoria })
                });

                const dados = await resp.json();

                if (!resp.ok) {
                    alert(dados.erro || 'Erro ao salvar gasto.');
                    btn.disabled = false;
                    btn.textContent = 'Salvar';
                    return;
                }

                await ganharXp('gasto', desc);
                alert('Gasto registrado!\n\n' + desc + ' (' + categoria + ') — R$ ' + valor.toFixed(2).replace('.', ','));
                window.location.href = 'menu';

            } catch (err) {
                console.error(err);
                alert('Não foi possível conectar ao servidor.');
                btn.disabled = false;
                btn.textContent = 'Salvar';
            }
        }
    </script>




</body>

</html>
