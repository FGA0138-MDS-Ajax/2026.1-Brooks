<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PiggyMe – Relatórios</title>
    <script src="../js/auth.js"></script>
    <link rel="stylesheet" href="../css/menu.css">
</head>
<body>

    <header>
        <img src="../images/piggyme_logo2.png" class="porco-logo" alt="Logo PiggyMe">
        <div class="menu-direita">
            <h2 id="saudacao">Olá!</h2>
            <div class="botao-inicio">
                <button onclick="window.location.href='/menu'"><strong>Início</strong></button>
            </div>
        </div>
    </header>

    <main class="dashboard">

        <aside class="botoes-resto">
            <button onclick="window.location.href='menu'">
                <svg fill="currentColor" viewBox="0 0 24 24">
                    <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
                </svg>
                Dashboard
            </button>
            <button onclick="window.location.href='add_gastos'">
                <svg fill="currentColor" viewBox="0 0 24 24">
                    <path d="M21 7H3a1 1 0 00-1 1v12a2 2 0 002 2h16a2 2 0 002-2V8a1 1 0 00-1-1zm-1 12H4V9h16v10zM3 5h15a1 1 0 000-2H3a1 1 0 000 2z"/>
                </svg>
                Gastos
            </button>
            <button>
                <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="10"/>
                    <circle cx="12" cy="12" r="6"/>
                    <circle cx="12" cy="12" r="2"/>
                </svg>
                Metas
            </button>
            <button onclick="window.location.href='/historico'">
                <svg fill="currentColor" viewBox="0 0 24 24">
                    <path d="M5 12H3v9h2v-9zm4-5H7v14h2V7zm4-4h-2v18h2V3zm4 8h-2v10h2v-10zm4-4h-2v14h2V7z"/>
                </svg>
                Relatórios
            </button>
            <button class="btn-sair" onclick="sair()">
                <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round"
                          d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
                </svg>
                Sair
            </button>
        </aside>

        <section class="conteudo">
            <div class="card" style="padding: 40px; text-align: center;">
                <h2 style="color: #73002f; font-size: 32px; margin-bottom: 16px;">Relatórios Financeiros</h2>
                <p style="color: #555; font-size: 18px;">Em desenvolvimento — Sprint 4</p>
            </div>
        </section>

    </main>

    <script src="../js/gamification.js"></script>
    <script>
        const usuario = JSON.parse(localStorage.getItem('usuario') || '{}');
        if (usuario.nome) {
            document.getElementById('saudacao').textContent = `Olá, ${usuario.nome}!`;
        }
    </script>

</body>
</html>
