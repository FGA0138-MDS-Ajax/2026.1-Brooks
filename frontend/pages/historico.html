<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PiggyMe – Histórico Financeiro</title>

    <link rel="stylesheet" href="../css/menu.css">

    <style>
        .historico-container {
            padding: 40px;
            width: 100%;
        }

        .historico-container h2 {
            font-size: 38px;
            color: #73002f;
            margin-bottom: 30px;
            text-align: center;
        }

        .tabela-wrapper {
            background: white;
            border-radius: 20px;
            border: 4px solid #333;
            overflow: hidden;
        }

        .tabela-historico {
            width: 100%;
            border-collapse: collapse;
            font-family: Arial, Helvetica, sans-serif;
        }

        .tabela-historico th {
            background-color: #73002f;
            color: white;
            font-size: 20px;
            padding: 20px;
            text-align: left;
        }

        .tabela-historico td {
            padding: 18px 20px;
            font-size: 18px;
            color: #333;
            border-bottom: 2px solid #f0f0f0;
        }

        .tabela-historico tr:last-child td {
            border-bottom: none;
        }

        .tabela-historico tr:hover {
            background-color: #f9fdf6;
        }

        .valor-receita { color: #27ae60; font-weight: bold; }
        .valor-despesa { color: #c0392b; font-weight: bold; }

        .sem-registros {
            text-align: center;
            padding: 40px !important;
            font-size: 20px;
            color: #777;
        }

        /* ── Botões de ação ── */
        .acoes-cell {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .btn-editar, .btn-excluir {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s, transform 0.15s;
            padding: 0;
            flex-shrink: 0;
        }

        .btn-editar { background: #eaf4e2; color: #2e7d32; }
        .btn-editar:hover { background: #c8e6c9; transform: scale(1.08); }
        .btn-excluir { background: #fdecea; color: #c0392b; }
        .btn-excluir:hover { background: #f5c6c2; transform: scale(1.08); }

        .btn-editar svg, .btn-excluir svg {
            width: 18px;
            height: 18px;
        }

        /* ── Modal de edição ── */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.45);
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        .modal-overlay.ativo { display: flex; }

        .modal-box {
            background: white;
            border-radius: 20px;
            border: 3px solid #73002f;
            padding: 36px;
            width: 90%;
            max-width: 460px;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .modal-box h3 {
            color: #73002f;
            font-size: 22px;
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
        }

        .modal-campo {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .modal-campo label {
            font-size: 15px;
            font-weight: bold;
            color: #333;
            font-family: Arial, Helvetica, sans-serif;
        }

        .modal-campo input,
        .modal-campo select {
            height: 50px;
            border-radius: 12px;
            border: 2px solid #ccc;
            font-size: 16px;
            padding: 0 16px;
            outline: none;
            font-family: Arial, Helvetica, sans-serif;
            color: #333;
            transition: border-color 0.2s;
        }

        .modal-campo input:focus,
        .modal-campo select:focus { border-color: #73002f; }

        .modal-erro {
            color: #c0392b;
            font-size: 14px;
            font-family: Arial, Helvetica, sans-serif;
            display: none;
        }

        .modal-botoes {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
            margin-top: 4px;
        }

        .modal-botoes button {
            height: 46px;
            padding: 0 24px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            border: 2px solid #ccc;
            background: white;
            color: #333;
            transition: 0.2s;
            font-family: Arial, Helvetica, sans-serif;
        }

        .modal-botoes button:hover { background-color: #f0f0f0; }

        .modal-botoes .btn-confirmar {
            border-color: #73002f;
            background-color: #73002f;
            color: white;
        }

        .modal-botoes .btn-confirmar:hover { background-color: #5c0f27; }

        /* ── Toast ── */
        .toast {
            position: fixed;
            bottom: 32px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: #333;
            color: white;
            padding: 14px 28px;
            border-radius: 40px;
            font-size: 15px;
            font-weight: bold;
            font-family: Arial, Helvetica, sans-serif;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s, transform 0.3s;
            z-index: 200;
            white-space: nowrap;
            box-shadow: 0 4px 20px rgba(0,0,0,0.18);
        }
        .toast.visivel { opacity: 1; transform: translateX(-50%) translateY(0); }
        .toast.sucesso { background: #2e7d32; }
        .toast.erro    { background: #c0392b; }
    </style>
</head>

<body>
    <header>
        <img src="../images/piggyme_logo2.png" class="porco-logo" alt="Logo PiggyMe">
        <div class="menu-direita">
            <h2 id="saudacao">Olá!</h2>
            <div class="botao-inicio">
                <button onclick="window.location.href='menu'"><strong>Início</strong></button>
            </div>
            <div class="icone_conta">
                <img src="../images/icone_conta.png" alt="Ícone da conta">
            </div>
        </div>
    </header>

    <main class="dashboard">
        <aside class="botoes-resto">

            <button onclick="window.location.href='dashboard'">
                <span class="sidebar-icon">
                    <svg fill="currentColor" viewBox="0 0 24 24">
                        <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
                    </svg>
                </span>
                Dashboard
            </button>

            <button onclick="window.location.href='add_gastos'">
                <span class="sidebar-icon">
                    <svg fill="currentColor" viewBox="0 0 24 24">
                        <path d="M21 7H3a1 1 0 00-1 1v12a2 2 0 002 2h16a2 2 0 002-2V8a1 1 0 00-1-1zm-1 12H4V9h16v10zM3 5h15a1 1 0 000-2H3a1 1 0 000 2z"/>
                    </svg>
                </span>
                Gastos
            </button>

            <button onclick="window.location.href='/metas'">
                <span class="sidebar-icon">
                    <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"/>
                        <circle cx="12" cy="12" r="6"/>
                        <circle cx="12" cy="12" r="2"/>
                    </svg>
                </span>
                Metas
            </button>

            <button onclick="window.location.href='/relatorios'">
                <span class="sidebar-icon">
                    <svg fill="currentColor" viewBox="0 0 24 24">
                        <path d="M5 12H3v9h2v-9zm4-5H7v14h2V7zm4-4h-2v18h2V3zm4 8h-2v10h2v-10zm4-4h-2v14h2V7z"/>
                    </svg>
                </span>
                Relatórios
            </button>

            <button onclick="window.location.href='/cursos'">
                <span class="sidebar-icon">
                    <svg fill="currentColor" viewBox="0 0 24 24">
                        <path d="M12 3L1 9l11 6 9-4.91V17h2V9M5 13.18v4L12 21l7-3.82v-4L12 17l-7-3.82z"/>
                    </svg>
                </span>
                Cursos
            </button>


            <button onclick="window.location.href='/historico'">
        <span class="sidebar-icon">
            <svg fill="currentColor" viewBox="0 0 24 24">
                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm1-13h-2v6l5.25 3.15L17 12.23l-4-2.37V7z"/>
            </svg>
        </span>
        Histórico
        </button>

            <button class="btn-sair" onclick="sair()">
                <span class="sidebar-icon">
                    <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" color="#666">
                        <path stroke-linecap="round" stroke-linejoin="round"
                              d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
                    </svg>
                </span>
                Sair
            </button>

        </aside>

        <section class="conteudo">
            <div class="card" style="align-items: flex-start;">
                <div class="historico-container">
                    <h2>Seu Histórico Financeiro</h2>

                    <div class="tabela-wrapper">
                        <table class="tabela-historico">
                            <thead>
                                <tr>
                                    <th>Data</th>
                                    <th>Descrição</th>
                                    <th>Categoria</th>
                                    <th>Valor</th>
                                    <th>Ações</th>
                                </tr>
                            </thead>
                            <tbody id="corpoTabela">
                                <tr>
                                    <td colspan="5" class="sem-registros">Carregando transações...</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- Modal de edição -->
    <div class="modal-overlay" id="modalEdicao">
        <div class="modal-box">
            <h3>Editar transação</h3>

            <div class="modal-campo">
                <label for="editDescricao">Descrição</label>
                <input type="text" id="editDescricao" maxlength="100" placeholder="Ex: Mercado, Salário…">
            </div>

            <div class="modal-campo">
                <label for="editValor">Valor (R$)</label>
                <input type="number" id="editValor" min="0" step="0.01" placeholder="R$ 0,00">
            </div>

            <div class="modal-campo">
                <label for="editCategoria">Categoria</label>
                <input type="text" id="editCategoria" maxlength="50" placeholder="Ex: Alimentação…">
            </div>

            <span class="modal-erro" id="editErro"></span>

            <div class="modal-botoes">
                <button onclick="fecharModal()">Cancelar</button>
                <button class="btn-confirmar" onclick="salvarEdicao()">Salvar alterações</button>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <script src="../js/gamification.js"></script>
    <script>
        const usuario = JSON.parse(localStorage.getItem('usuario') || '{}');
        if (usuario.nome) {
            document.getElementById('saudacao').textContent = `Olá, ${usuario.nome}!`;
        }

        const token = localStorage.getItem('token');
        const corpoTabela = document.getElementById('corpoTabela');
        let editandoId = null;

        const fmt = v => parseFloat(v).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });

        /* ── Toast ── */
        function mostrarToast(msg, tipo = 'sucesso') {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.className = `toast ${tipo} visivel`;
            clearTimeout(t._timer);
            t._timer = setTimeout(() => t.classList.remove('visivel'), 3000);
        }

        /* ── Carregar histórico ── */
        async function carregarHistorico() {
            try {
                const r = await fetch('/api/transacoes', {
                    headers: { Authorization: `Bearer ${token}` }
                });
                const dados = await r.json();

                if (!r.ok) {
                    corpoTabela.innerHTML = `<tr><td colspan="5" class="sem-registros">Erro: ${dados.erro}</td></tr>`;
                    return;
                }

                const transacoes = dados.transacoes || [];

                if (!transacoes.length) {
                    corpoTabela.innerHTML = `<tr><td colspan="5" class="sem-registros">Nenhuma transação encontrada. Adicione uma receita ou gasto para começar!</td></tr>`;
                    return;
                }

                corpoTabela.innerHTML = '';

                transacoes.forEach(t => {
                    const data = new Date(t.data).toLocaleDateString('pt-BR', { timeZone: 'UTC' });
                    const classeValor = t.tipo === 'receita' ? 'valor-receita' : 'valor-despesa';
                    const sinal = t.tipo === 'receita' ? '+' : '-';

                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${data}</td>
                        <td>${t.descricao}</td>
                        <td>${t.categoria || '—'}</td>
                        <td class="${classeValor}">${sinal} ${fmt(t.valor)}</td>
                        <td>
                            <div class="acoes-cell">
                                <button class="btn-editar" title="Editar" onclick='abrirModal(${JSON.stringify(t)})'>
                                    <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                        <path stroke-linecap="round" stroke-linejoin="round"
                                              d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5
                                                 m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/>
                                    </svg>
                                </button>
                                <button class="btn-excluir" title="Excluir" onclick="excluir(${t.id})">
                                    <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                        <polyline points="3 6 5 6 21 6"/>
                                        <path stroke-linecap="round" stroke-linejoin="round"
                                              d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6
                                                 m3 0V4a1 1 0 011-1h4a1 1 0 011 1v2"/>
                                    </svg>
                                </button>
                            </div>
                        </td>
                    `;
                    corpoTabela.appendChild(tr);
                });

            } catch (e) {
                console.error(e);
                corpoTabela.innerHTML = `<tr><td colspan="5" class="sem-registros">Falha de comunicação com o servidor.</td></tr>`;
            }
        }

        /* ── Modal edição ── */
        function abrirModal(t) {
            editandoId = t.id;
            document.getElementById('editDescricao').value = t.descricao;
            document.getElementById('editValor').value     = t.valor;
            document.getElementById('editCategoria').value = t.categoria || '';
            document.getElementById('editErro').style.display = 'none';
            document.getElementById('modalEdicao').classList.add('ativo');
        }

        function fecharModal() {
            editandoId = null;
            document.getElementById('modalEdicao').classList.remove('ativo');
        }

        async function salvarEdicao() {
            const descricao = document.getElementById('editDescricao').value.trim();
            const valor     = parseFloat(document.getElementById('editValor').value);
            const categoria = document.getElementById('editCategoria').value.trim();
            const erroEl    = document.getElementById('editErro');

            if (!descricao) { erroEl.textContent = 'Informe uma descrição.'; erroEl.style.display = 'block'; return; }
            if (!valor || valor <= 0) { erroEl.textContent = 'Informe um valor válido.'; erroEl.style.display = 'block'; return; }
            erroEl.style.display = 'none';

            try {
                const r = await fetch(`/api/transacoes/${editandoId}`, {
                    method : 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        Authorization : `Bearer ${token}`
                    },
                    body: JSON.stringify({ descricao, valor, categoria: categoria || null })
                });

                const d = await r.json();
                if (!r.ok) { erroEl.textContent = d.erro || 'Erro ao salvar.'; erroEl.style.display = 'block'; return; }

                fecharModal();
                mostrarToast('Transação atualizada!', 'sucesso');
                await carregarHistorico();
            } catch { erroEl.textContent = 'Erro de conexão.'; erroEl.style.display = 'block'; }
        }

        /* ── Excluir ── */
        async function excluir(id) {
            if (!confirm('Deseja excluir esta transação?')) return;
            try {
                const r = await fetch(`/api/transacoes/${id}`, {
                    method : 'DELETE',
                    headers: { Authorization: `Bearer ${token}` }
                });
                if (!r.ok) { const d = await r.json(); return alert(d.erro); }
                mostrarToast('Transação excluída.', 'erro');
                await carregarHistorico();
            } catch { alert('Erro de conexão.'); }
        }

        /* Fechar modal clicando fora */
        document.getElementById('modalEdicao').addEventListener('click', function(e) {
            if (e.target === this) fecharModal();
        });

        carregarHistorico();
    </script>
</body>
</html>
