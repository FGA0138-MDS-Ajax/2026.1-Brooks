<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PiggyMe</title>
    <link rel="stylesheet" href="../css/menu.css">
    <link rel="stylesheet" href="../css/add_receita.css">
</head>

<body>

    <header>
        <img src="../images/piggyme_logo2.png" class="porco-logo" alt="Logo PiggyMe">
        <div class="menu-direita">
            <h2 id="saudacao">Olá!</h2>
            <div class="botao-inicio">
                <button onclick="window.location.href='menu'">
                    <strong>Início</strong>
                </button>
            </div>
            <div class="icone_conta">
                <img src="../images/icone_conta.png" alt="Ícone da conta">
            </div>
        </div>
    </header>

    <main class="dashboard">

        <aside class="botoes-resto">
            <button>Dashboard</button>
            <button onclick="window.location.href='receita'">Receita</button>
            <button>Metas</button>
            <button>Relatórios</button>
        </aside>

        <section class="conteudo">
            <div class="card">
                <div class="form-receita">

                    <h2>Adicionar Entrada</h2>

                    <div class="campos">
                        <div class="campo-grupo">
                            <label for="descricao">Descrição</label>
                            <input type="text"
                                   id="descricao"
                                   placeholder="Ex: Salário, Freelance…"
                                   maxlength="100">
                        </div>

                        <div class="campo-grupo">
                            <label for="valor">Valor (R$)</label>
                            <input type="number"
                                   id="valor"
                                   placeholder="0,00"
                                   min="0"
                                   step="0.01">
                        </div>
                    </div>

                    <div class="botoes-form">
                        <a class="btn-cancelar" href="menu">Cancelar</a>
                        <button class="btn-salvar" onclick="salvar()">Salvar</button>
                    </div>

                </div>
            </div>
        </section>

    </main>

    <script src="../js/gamification.js"></script>
    <script>
        // Saudação no header
        const usuario = JSON.parse(localStorage.getItem('usuario') || '{}');
        if (usuario.nome) {
            document.getElementById('saudacao').textContent = `Olá, ${usuario.nome}!`;
        }

        async function salvar() {
            const desc  = document.getElementById('descricao').value.trim();
            const valor = parseFloat(document.getElementById('valor').value);

            if (!desc)                { alert('Informe uma descrição.'); return; }
            if (!valor || valor <= 0) { alert('Informe um valor válido.'); return; }

            const btn = document.querySelector('.btn-salvar');
            btn.disabled = true;
            btn.textContent = 'Salvando…';

            try {
                const token = localStorage.getItem('token');
                const resp = await fetch('/api/transacoes/receita', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ descricao: desc, valor })
                });

                const dados = await resp.json();

                if (!resp.ok) {
                    alert(dados.erro || 'Erro ao salvar receita.');
                    btn.disabled = false;
                    btn.textContent = 'Salvar';
                    return;
                }

                await ganharXp('receita', desc);
                alert('Entrada adicionada!\n\n' + desc + ' — R$ ' + valor.toFixed(2).replace('.', ','));
                window.location.href = 'menu';

            } catch (err) {
                console.error(err);
                alert('Não foi possível conectar ao servidor.');
                btn.disabled = false;
                btn.textContent = 'Salvar';
            }
        }
    </script>

</body>
</html>
