<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PiggyMe – Registrar Receita</title>
    <link rel="stylesheet" href="../css/menu.css">
    <link rel="stylesheet" href="../css/add_receita.css">
    <link rel="stylesheet" href="../css/historico_edicao.css">
    <script src="../js/auth.js"></script>
</head>

<body>

    <header>
        <img src="../images/piggyme_logo2.png" class="porco-logo" alt="Logo PiggyMe">
        <div class="menu-direita">
            <h2 id="saudacao">Olá, fulano! 👋</h2>
            <div class="header-icones">
                <button class="icone-btn">
                   
                </button>
                <button class="icone-btn icone-casa" onclick="window.location.href='menu'">
                    <svg fill="currentColor" viewBox="0 0 24 24">
                        <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z" />
                    </svg>
                </button>
            </div>
        </div>
    </header>

    <main class="dashboard">

        <aside class="botoes-resto">

            <button onclick="window.location.href='/'">
                <span class="sidebar-icon">
                    <svg fill="currentColor" viewBox="0 0 24 24">
                        <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
                    </svg>
                </span>
                Menu
            </button>

            <button onclick="window.location.href='add_gastos'">
                <span class="sidebar-icon">
                    <svg fill="currentColor" viewBox="0 0 24 24">
                        <path d="M21 7H3a1 1 0 00-1 1v12a2 2 0 002 2h16a2 2 0 002-2V8a1 1 0 00-1-1zm-1 12H4V9h16v10zM3 5h15a1 1 0 000-2H3a1 1 0 000 2z"/>
                    </svg>
                </span>
                Gastos
            </button>

            <button onclick="window.location.href='/metas'">
                <span class="sidebar-icon">
                    <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"/>
                        <circle cx="12" cy="12" r="6"/>
                        <circle cx="12" cy="12" r="2"/>
                    </svg>
                </span>
                Metas
            </button>

            <button onclick="window.location.href='/relatorios'">
                <span class="sidebar-icon">
                    <svg fill="currentColor" viewBox="0 0 24 24">
                        <path d="M5 12H3v9h2v-9zm4-5H7v14h2V7zm4-4h-2v18h2V3zm4 8h-2v10h2v-10zm4-4h-2v14h2V7z"/>
                    </svg>
                </span>
                Relatórios
            </button>

            <button onclick="window.location.href='/cursos'">
                <span class="sidebar-icon">
                    <svg fill="currentColor" viewBox="0 0 24 24">
                        <path d="M12 3L1 9l11 6 9-4.91V17h2V9M5 13.18v4L12 21l7-3.82v-4L12 17l-7-3.82z"/>
                    </svg>
                </span>
                Cursos
            </button>


            <button onclick="window.location.href='/historico'">
        <span class="sidebar-icon">
            <svg fill="currentColor" viewBox="0 0 24 24">
                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm1-13h-2v6l5.25 3.15L17 12.23l-4-2.37V7z"/>
            </svg>
        </span>
        Histórico
        </button>

            <button onclick="window.location.href='dashboard'">
                <span class="sidebar-icon">
                    <svg fill="currentColor" viewBox="0 0 24 24">
                        <path d="M3 19h18v2H3zm2-4 4-4 4 3 6-8 2 1.5-7.5 10-4-3-3.5 3.5z"/>
                    </svg>
                </span>
                Dashboard
            </button>

            <button class="btn-sair" onclick="sair()">
                <span class="sidebar-icon">
                    <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" color="#666">
                        <path stroke-linecap="round" stroke-linejoin="round"
                              d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
                    </svg>
                </span>
                Sair
            </button>

            

        </aside>

        <section class="conteudo">

            <div class="hero-banner">
                <div class="hero-icone">
                    <svg fill="currentColor" viewBox="0 0 24 24">
                        <path
                            d="M11.8 10.9c-2.27-.59-3-1.2-3-2.15 0-1.09 1.01-1.85 2.7-1.85 1.78 0 2.44.85 2.5 2.1h2.21c-.07-1.72-1.12-3.3-3.21-3.81V3h-3v2.16c-1.94.42-3.5 1.68-3.5 3.61 0 2.31 1.91 3.46 4.7 4.13 2.5.6 3 1.48 3 2.41 0 .69-.49 1.79-2.7 1.79-2.06 0-2.87-.92-2.98-2.1h-2.2c.12 2.19 1.76 3.42 3.68 3.83V21h3v-2.15c1.95-.37 3.5-1.5 3.5-3.55 0-2.84-2.43-3.81-4.7-4.4z" />
                    </svg>
                </div>
                <div class="hero-texto">
                    <h1>Registrar receita</h1>
                    <p>Registre suas entradas e acompanhe o crescimento do seu saldo.</p>
                </div>
                <img src="../images/22.png" class="hero-imagem-deco" alt="Ilustração financeira">
            </div>

            <div class="grid-form-resumo">

                <div class="card-form">
                    <div class="campos-grid">

                        <div class="campo-grupo">
                            <label for="descricao">Nome da receita</label>
                            <input type="text" id="descricao" placeholder="Ex: Salário, Freelance…" maxlength="100">
                        </div>

                        <div class="campo-grupo">
                            <label for="valor">Valor (R$)</label>
                            <input type="number" id="valor" placeholder="R$ 0,00" min="0" step="0.01">
                        </div>

                        <div class="campo-grupo">
                            <label for="categoria">Categoria</label>
                            <select id="categoria">
                                <option value="">Selecione uma categoria</option>
                            </select>
                            <span class="erro-categoria" id="erroCategoria">Selecione uma categoria.</span>
                        </div>

                        <div class="campo-grupo">
                            <label for="data">Data</label>
                            <div class="input-data-wrap">
                                <input type="date" id="data">
                                <span class="icone-cal">
                                    <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                        <rect x="3" y="4" width="18" height="18" rx="2" ry="2" />
                                        <line x1="16" y1="2" x2="16" y2="6" />
                                        <line x1="8" y1="2" x2="8" y2="6" />
                                        <line x1="3" y1="10" x2="21" y2="10" />
                                    </svg>
                                </span>
                            </div>
                        </div>

                    </div>

                    <div class="campo-grupo">
                        <label for="meta">Destinar para meta</label>

                        <select id="meta">
                            <option value="">
                                Não vincular a uma meta
                            </option>
                        </select>
                    </div>


                    <div class="campo-grupo">
                        <label for="valorMeta">
                            Valor para meta (R$)
                        </label>

                        <input type="number" id="valorMeta" placeholder="0,00" min="0" step="0.01">
                    </div>

                    <div class="botoes-form">
                        <button class="btn-salvar" onclick="salvar()">Salvar receita</button>
                        <a class="btn-cancelar" href="menu">Cancelar</a>
                    </div>


                </div>

                <div class="card-resumo">
                    <div class="resumo-titulo">
                        <svg viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M18 2a16 16 0 100 32A16 16 0 0018 2z" fill="#e8f5e2" />
                            <path d="M18 2v16l11.31 11.31A16 16 0 0018 2z" fill="#73002f" opacity=".7" />
                            <path d="M18 18L6.69 29.31A16 16 0 0018 34V18z" fill="#73002f" opacity=".4" />
                        </svg>
                        <span>Resumo rápido</span>
                    </div>
                    <div class="resumo-linha">
                        <label>Saldo atual:</label>
                        <span class="valor" id="saldoAtual">R$ –</span>
                    </div>
                    <div class="resumo-linha">
                        <label>Após esta receita:</label>
                        <span class="valor" id="saldoApos">R$ –</span>
                    </div>
                </div>

            </div>

            <div class="card-historico">
                <div class="historico-cabecalho">
                    <svg fill="currentColor" viewBox="0 0 24 24" width="24" height="24">
                        <path
                            d="M13 3a9 9 0 10.001 18.001A9 9 0 0013 3zm0 16a7 7 0 110-14 7 7 0 010 14zm.5-11H12v6l5.25 3.15.75-1.23-4.5-2.67V8z" />
                    </svg>

                </div>

        </section>

    </main>

    <div class="modal-overlay" id="modalCategoria">
        <div class="modal-box">
            <h3>Nova categoria</h3>
            <input type="text" id="novaCategoriaInput" placeholder="Ex: Bônus, Investimentos…" maxlength="50">
            <div class="modal-botoes">
                <button onclick="fecharModalCategoria()">Cancelar</button>
                <button class="btn-confirmar" onclick="confirmarNovaCategoria()">Criar</button>
            </div>
        </div>
    </div>



    <script src="../js/gamification.js"></script>
    <script src="../js/add_receita.js"></script>
    <script>
        const usuario = JSON.parse(localStorage.getItem('usuario') || '{}');
        if (usuario.nome) {
            document.getElementById('saudacao').textContent = `Olá, ${usuario.nome}!`;
        }
    </script>
</body>

</html>
