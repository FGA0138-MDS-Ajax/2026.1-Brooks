<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Piggyme Login</title>

  <link rel="stylesheet" href="../css/login_cadastro.css">

  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>

<body>

  <nav>

    <div class="logo-area">
      <img src="../images/piggyme_logo2.png" alt="Piggyme">
    </div>

    <div class="nav-right">

      <div class="create-account">
        <span>Não tem uma conta?</span>

        <button onclick="window.location.href='cadastro'">
          Criar conta
        </button>
      </div>

      <div class="home-icon">
        <img
          src="../images/casa_vermelha.png"
          alt="Casa"
          onclick="window.location.href = '/'"
        >
        
      </div>

    </div>

  </nav>

  <main>

    <div class="left-background"></div>

    <img
      src="../images/piggyme_logo.png"
      class="pig-background"
      alt=""
    >

    <div class="auth-container">

      <div class="auth-box">

        <div class="avatar-circle">

          <svg viewBox="0 0 24 24">
            <path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z"/>
          </svg>

        </div>

        <input
          type="text"
          class="input-field"
          placeholder="Usuário"
        >

        <input
          type="password"
          class="input-field"
          placeholder="Senha"
        >

        <a href="/forgot_password" class="forgot">
         Esqueceu sua senha?
        </a>

        <button class="btn-main">
          Login
        </button>

      </div>

    </div>

  </main>

</body>
    <script src="../js/login.js"></script>
</html>
