<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>PiggyMe</title>

    <link rel="stylesheet"
          href="../css/menu.css">

</head>

<body>



    <header>

        <img src="../images/piggyme_logo2.png"
             class="porco-logo"
             alt="Logo PiggyMe">

        <div class="menu-direita">

            <div class="botao-inicio">

                <button>
                    <strong>Início</strong>
                </button>

            </div>

            <div class="icone_conta">

                <img src="../images/icone_conta.png"
                     alt="Ícone da conta">

            </div>

        </div>

    </header>



    <main class="dashboard">

        <aside class="botoes-resto">

            <button>Categoria</button>

            <button>Categoria</button>

            <button>Categoria</button>

            <button>Categoria</button>

            <button onclick="window.location.href='add_gastos'">Informar gasto -</button>

            <button onclick="window.location.href='add_receita'">Adicionar entrada +</button>

        </aside>

        <section class="conteudo">

            <div class="segunda-header">
                <div>

                        <h1>Seu dinheiro sob controle</h1>

                        <h2>Sem complicação</h2>

                    </div>
                <img class="pig-background" src="../images/pig_background.png">
            </div>

            <div class="cards-area">

                

                <div class="coluna-esquerda">

                    <div class="card saldo-card">

                        <div>

                            <h2>Saldo</h2>

                            <h1>R$ 16.100,00</h1>

                        </div>

                        <div class="icone-moeda">

                            $

                        </div>

                    </div>

                    <div class="card xp-card">

                        <div class="xp-info">

                            <h2>Nível 2</h2>

                            <h1>XP</h1>

                            <div class="barra-xp">

                                <div class="xp-preenchido"></div>

                            </div>

                        </div>

                        <img src="../images/porco_feliz.png"
                             class="porquinho"
                             alt="Porquinho">

                    </div>

                    <div class="card objetivos-card">

                        <div class="objetivos-topo">

                            <h2>Seus objetivos</h2>

                            <span>+</span>

                        </div>

                        <div class="objetivo">

                            <p>• XXXXXXXXXXXX</p>

                            <span>0 / 1000</span>

                        </div>

                        <div class="objetivo">

                            <p>• XXXXXXXXXXXX</p>

                            <span>0 / 1000</span>

                        </div>

                    </div>

                </div>

                <div class="coluna-direita">

                    <div class="card resumo-card">

                        <h2>Resumo do seu mês</h2>

                        <div class="resumo-box"></div>

                        <div class="grafico-pizza"></div>

                    </div>

                </div>

            </div>

        </section>

    </main>

</body>

</html>
