<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PiggyMe</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/menu.css">
    <script src="../js/auth.js"></script>

</head>

<body>


    <header>
        <img src="../images/piggyme_logo2.png" class="porco-logo" alt="Logo PiggyMe">
        <div class="menu-direita">
            <h2 id="saudacao">Olá!</h2>
            <div class="botao-inicio">
                <button onclick="window.location.href='/'"><strong>Início</strong></button>
            </div>
            <div class="icone_conta">
                <img src="../images/icone_conta.png" alt="Ícone da conta">
            </div>
        </div>
    </header>

    <main class="dashboard">

        <aside class="botoes-resto">

            <button onclick="window.location.href='/'">
                <span class="sidebar-icon">
                    <svg fill="currentColor" viewBox="0 0 24 24">
                        <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
                    </svg>
                </span>
                Menu
            </button>

            <button onclick="window.location.href='add_gastos'">
                <span class="sidebar-icon">
                    <svg fill="currentColor" viewBox="0 0 24 24">
                        <path d="M21 7H3a1 1 0 00-1 1v12a2 2 0 002 2h16a2 2 0 002-2V8a1 1 0 00-1-1zm-1 12H4V9h16v10zM3 5h15a1 1 0 000-2H3a1 1 0 000 2z"/>
                    </svg>
                </span>
                Gastos
            </button>

            <button onclick="window.location.href='/metas'">
                <span class="sidebar-icon">
                    <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"/>
                        <circle cx="12" cy="12" r="6"/>
                        <circle cx="12" cy="12" r="2"/>
                    </svg>
                </span>
                Metas
            </button>

            <button onclick="window.location.href='/relatorios'">
                <span class="sidebar-icon">
                    <svg fill="currentColor" viewBox="0 0 24 24">
                        <path d="M5 12H3v9h2v-9zm4-5H7v14h2V7zm4-4h-2v18h2V3zm4 8h-2v10h2v-10zm4-4h-2v14h2V7z"/>
                    </svg>
                </span>
                Relatórios
            </button>



            <button onclick="window.location.href='/historico'">
        <span class="sidebar-icon">
            <svg fill="currentColor" viewBox="0 0 24 24">
                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm1-13h-2v6l5.25 3.15L17 12.23l-4-2.37V7z"/>
            </svg>
        </span>
        Histórico
        </button>

            <button onclick="window.location.href='dashboard'">
                <span class="sidebar-icon">
                    <svg fill="currentColor" viewBox="0 0 24 24">
                        <path d="M3 19h18v2H3zm2-4 4-4 4 3 6-8 2 1.5-7.5 10-4-3-3.5 3.5z"/>
                    </svg>
                </span>
                Dashboard
            </button>

            <button class="btn-sair" onclick="sair()">
                <span class="sidebar-icon">
                    <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" color="#666">
                        <path stroke-linecap="round" stroke-linejoin="round"
                              d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
                    </svg>
                </span>
                Sair
            </button>

            

        </aside>


        <section class="conteudo">

            <div class="segunda-header">
                <div>
                    <h1>Seu dinheiro sob controle</h1>
                    <h2>Sem complicação</h2>
                    <aside class="botoes-header2">
                        <button onclick="window.location.href='add_gastos'">Adicionar gasto</button>
                        <button onclick="window.location.href='add_receita'">Registrar Receita</button>
                    </aside>
                </div>
                <img class="pig-background" src="../images/pig_background.png">
            </div>

            <div class="cards-area">

                <div class="card saldo-card">
                    <div>
                        <h2>Saldo</h2>
                        <h1 id="saldo-valor">R$ 0,00</h1>
                    </div>
                    <div class="icone-moeda">$</div>
                </div>

                <div class="card xp-card">
                    <h2>Metas Financeiras</h2>
                    <div id="listaMetas"></div>

                </div>

                <div class="card objetivos-card">
                    <div class="objetivos-topo">
                        <h2>Seu Progresso financeiro</h2>
                    </div>
                    <div class="xp-info">
                        <div class="xp-textos">
                            <h2>Nível 1</h2>
                            <h1>XP</h1>
                        </div>
                        <div class="barra-xp">
                            <div class="xp-preenchido" style="width: 20%;"></div>
                        </div>
                    </div>
                </div>

                <div class="card porquinho-card">
                    <h2 class="porquinho-text">Seu porquinho esta feliz</h2>
                    <img src="../images/porco_feliz.png" class="porquinho" alt="Porquinho">
                </div>

                <div class="card resumo-card">
                    <div class="categorias-titulo">
                        <h2>Gastos por categoria</h2>
                    </div>

                    <div class="categorias-conteudo">
                        <div class="grafico-pizza" id="graficoPizza"></div>

                        <div class="legenda">

                            <div class="item-legenda">
                                <span class="dot"></span>
                                <span class="nome"></span>
                                <span class="valor"></span>
                            </div>

                            <div class="item-legenda">
                                <span class="dot"></span>
                                <span class="nome"></span>
                                <span class="valor"></span>
                            </div>

                            <div class="item-legenda">
                                <span class="dot"></span>
                                <span class="nome"></span>
                                <span class="valor"></span>
                            </div>

                            <div class="item-legenda">
                                <span class="dot"></span>
                                <span class="nome"></span>
                                <span class="valor"></span>
                            </div>

                            <div class="item-legenda">
                                <span class="dot"></span>
                                <span class="nome"></span>
                                <span class="valor"></span>
                            </div>

                        </div>
                    </div>
                </div>

            </div>

        </section>

    </main>

    <script src="../js/gamification.js"></script>
    <script src="../js/saldo.js"></script>
    <script>
        const usuario = JSON.parse(localStorage.getItem('usuario') || '{}');
        if (usuario.nome) {
            document.getElementById('saudacao').textContent = `Olá, ${usuario.nome}!`;
        }
    </script>

</body>

</html>
